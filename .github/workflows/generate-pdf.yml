name: Generate PDF CVs and Release

on:
  push:
    branches:
      - master
      - main
    paths:
      - '**.md'

permissions:
  contents: write

env:
  USER_NAME: ${{ github.actor }}
  FILE_PREFIX: "CV"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate PDFs natively via npx
        run: |
          # Use npx to process target markdown files (exclude repo README if specialized CV files exist)
          shopt -s nullglob
          files=(*.md)
          targets=()
          for f in "${files[@]}"; do
            if [ "$f" != "README.md" ]; then
              targets+=("$f")
            fi
          done
          # If only README.md exists, use it as fallback
          if [ ${#targets[@]} -eq 0 ] && [ -f "README.md" ]; then
            targets=("README.md")
          fi
          if [ ${#targets[@]} -gt 0 ]; then
            npx -y md-to-pdf "${targets[@]}"
          fi

      - name: Mix and Rename (Smart Deduplication & Formatting)
        run: |
          mkdir -p final_assets
          # Find all PDFs in the current directory and rename them cleanly
          find . -maxdepth 1 -name "*.pdf" | while read -r file; do
            original_name=$(basename "$file")
            # If the filename already begins with CV_, keep it intact to avoid prefix duplication
            if [[ "$original_name" =~ ^[Cc][Vv]_ ]]; then
              new_name="$original_name"
            else
              new_name="${{ env.FILE_PREFIX }}_${{ env.USER_NAME }}_${original_name}"
            fi
            mv "$file" "final_assets/${new_name}"
            echo "Prepared Asset: ${new_name}"
          done

      - name: Create Release and Upload All Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: latest
          name: Professional CV Documents (Latest)
          make_latest: true
          draft: false
          prerelease: false
          files: |
            final_assets/*.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
